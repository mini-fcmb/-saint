<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<link rel="icon" type="image/png" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SXaint</title>
    <style>
 .logo {
  display: block;
  margin: 20px auto; /* centers the logo */
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid #5a67d8;
  object-fit: cover; /* ensures it fits the circle */
}

</style>

  </head>
  <body>
     <img src="/logo.png" alt="Logo" class="logo" />
    <div id="root">
       
    </div>
    <script type="module" src="/src/main.tsx">
      document.addEventListener("DOMContentLoaded", function() {
        const canvas = document.getElementById('progressChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#5a67d8';
        ctx.beginPath();
        ctx.moveTo(30, 90);
        ctx.quadraticCurveTo(80, 60, 130, 70);
        ctx.quadraticCurveTo(180, 80, 230, 50);
        ctx.quadraticCurveTo(280, 30, 330, 65);
        ctx.quadraticCurveTo(360, 85, 380, 75);
        ctx.stroke();
      });
    </script>
  </body>
</html>
